services:
  database:
    image: postgis/postgis
    restart: always
    environment:
      - POSTGRES_DB=${postgres_db}
      - POSTGRES_USER=${postgres_username}
      - POSTGRES_PASSWORD=${postgres_password}
      - PGDATA=${postgres_data}
    ports:
      - ${postgres_ports}
    volumes:
      - ./data/postgres:/var/lib/postgresql


