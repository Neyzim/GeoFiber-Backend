spring.application.name=geofiber-backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL:${database.link:jdbc:postgresql://localhost:5432/geofiber}}
spring.datasource.username=${DATABASE_USERNAME:${postgres_username:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:${postgres_password:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hospedagem (docs/PUBLICAR-GRATUITO.md): o Render informa a porta em PORT; o pooler do Supabase
# limita conexões, então lá o pool fica menor (DB_POOL_SIZE=5). Sem as variáveis, valem os padrões locais.
server.port=${PORT:8080}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Origens do frontend liberadas no CORS (separadas por virgula)
geofiber.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Administrador inicial, criado na subida quando não existe nenhum usuário
geofiber.bootstrap.admin.email=${ADMIN_EMAIL:}
geofiber.bootstrap.admin.password=${ADMIN_PASSWORD:}
geofiber.bootstrap.admin.name=${ADMIN_NAME:Administrador}

# Segredo do JWT (mínimo 32 bytes). Obrigatório: a aplicação não sobe sem ele.
geofiber.security.jwt-secret=${GEOFIBER_JWT_SECRET:}

# Swagger e OpenAPI: desligados por padrão (produção). Na máquina de desenvolvimento, API_DOCS_ENABLED=true
# no .env (o "npm run api:types" do frontend lê /v3/api-docs).
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
